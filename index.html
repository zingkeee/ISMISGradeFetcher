<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Grade Book</title>
<style>
/* E-Ink / Paper style (ui-ux-pro-max): off-white, ink black, grain, sharp transitions */
:root{color-scheme:light dark;--paper:#FDFBF7;--ink:#1A1A1A;--mute:#5E5C57;--rule:#CFCAC0;--red:#C0301F;
--serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"Noto Serif","Times New Roman",serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--paper:#161512;--ink:#ECE8DC;--mute:#A6A196;--rule:#3A3832;--red:#FF7A63}}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);font:17px/1.45 var(--serif);font-variant-numeric:lining-nums tabular-nums;
padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(72px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.06;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{max-width:560px;margin:0 auto;padding:18px 20px 8px}
.top{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);
font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mono{font:500 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
h2{margin:34px 0 4px;font-size:1.05rem;font-weight:700;letter-spacing:.01em}
.note{margin:4px 0 10px;color:var(--mute);font-size:.9rem}
.cap{margin:26px 0 0}
.gwa-box{position:relative;display:inline-block;margin:10px 18px 10px 14px;padding:4px 18px}
.gwa{font-size:6.6rem;line-height:1.05;letter-spacing:-.03em}
.circle{position:absolute;left:-12px;top:-8px;width:calc(100% + 24px);height:calc(100% + 16px);overflow:visible}
.circle path{fill:none;stroke:var(--red);stroke-width:3.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.row{padding:12px 0;border-bottom:1px solid var(--rule)}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-size:1rem}
.val{font-size:1.25rem;font-weight:700;white-space:nowrap}
.meta{font:.72rem var(--mono);color:var(--mute)}
.rail{position:relative;height:18px;margin:6px 0 2px;
background:linear-gradient(var(--ink),var(--ink)) 0 50%/100% 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 0/1px 100% no-repeat,
linear-gradient(var(--ink),var(--ink)) 50% 0/1px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 0/1px 100% no-repeat}
.rail .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink)}
.rail .gl{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--red)}
.scale{display:flex;justify-content:space-between;font:.68rem var(--mono);color:var(--mute);margin-top:10px}
details{border-top:2px solid var(--ink);margin-top:14px}
summary{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .t{font-size:1.1rem;font-style:italic}
summary .g{font-weight:700;font-size:1.3rem}
summary .g::after{content:"+";font:500 1rem var(--mono);margin-left:12px;color:var(--mute)}
details[open] summary .g::after{content:"\2212"}
.sum{margin:0 0 4px;color:var(--mute);font:.75rem var(--mono)}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);
font:600 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:0}
.btn.ghost{background:transparent;color:var(--ink)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.btn:focus-within,.btn:focus-visible,.tabs button:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.actions{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin:16px 0}
.err{color:var(--red)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);
border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:56px;border:0;background:transparent;color:var(--mute);font:600 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-current=page]{color:var(--ink);box-shadow:inset 0 4px 0 var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>Grade Book</span><span id="stamp"></span></div>
  <section id="v-now"></section>
  <section id="v-terms" hidden></section>
  <section id="v-data" hidden></section>
</div>
<nav class="tabs" aria-label="Sections">
  <button data-tab="now">Overview</button><button data-tab="terms">Semesters</button><button data-tab="data">Data</button>
</nav>
<script src="grades.js"></script>
<script>
const KEY = "ismis-grades-v1", NS = "http://www.w3.org/2000/svg", $ = (s) => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const pct = (g) => Math.max(0, Math.min(1, (g - 1) / 2)) * 100;   // 1.0 (best) on the left, 3.0+ on the right
const small = new Set(["and","of","to","in","for","the","on","a","at"]);
const titleCase = (s) => s.toLowerCase().replace(/[a-z0-9]+/g, (w, i) => /^(i|ii|iii|iv|v|vi|it|ai|ict|hci)$/.test(w) ? w.toUpperCase() : (i > 0 && small.has(w)) ? w : w[0].toUpperCase() + w.slice(1));
const prettyTerm = (t) => { t = t.toLowerCase().replace(/\s*-\s*/, ", "); return t[0].toUpperCase() + t.slice(1); };
const shown = (v) => { v = (v || "").trim(); return !v || v === "NG" ? "\u2014" : /evaluate/i.test(v) ? "Pending" : v; };
const f2 = (g) => g == null ? "\u2014" : g.toFixed(2);

let store = null;
function load() {
  if (window.GRADES) return { data: window.GRADES, at: null };
  try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
const termsOf = (d) => (Array.isArray(d) ? d : d.terms || []);

function rail(g, mark) {
  const r = h("div", "rail");
  if (mark != null) { const l = h("b", "gl"); l.style.left = pct(mark) + "%"; r.append(l); }
  if (g != null) { const d = h("i", "dot"); d.style.left = pct(g) + "%"; r.append(d); }
  return r;
}
function scale() { const s = h("div", "scale"); ["1.0", "2.0", "3.0+"].forEach((t) => s.append(h("span", null, t))); return s; }
function circle() {
  const s = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "path");
  s.setAttribute("viewBox", "0 0 240 120"); s.setAttribute("preserveAspectRatio", "none"); s.setAttribute("class", "circle"); s.setAttribute("aria-hidden", "true");
  p.setAttribute("d", "M14 70C6 28 80 6 140 10c66 4 96 36 84 66-12 30-84 38-146 32C34 104 2 92 10 52");
  s.append(p); return s;
}

function viewNow(d) {
  const v = $("#v-now"); v.replaceChildren();
  const terms = termsOf(d), o = Array.isArray(d) ? null : d.overall, gwa = num(o && o.gwa);
  v.append(h("p", "mono cap", "General weighted average"));
  const box = h("div", "gwa-box"); box.append(h("div", "gwa", f2(gwa)), circle()); v.append(box);
  if (o && o.total_units_earned) v.append(h("p", "note", o.total_units_earned + " units earned. A lower number is a better grade."));
  v.append(h("h2", null, "By semester"), h("p", "note", "Each dot is one semester\u2019s GPA. Further left is better."), scale());
  terms.slice().reverse().forEach((t) => {
    const g = num(t.summary && t.summary.FG), row = h("div", "row"), r1 = h("div", "r1");
    r1.append(h("span", "name", prettyTerm(t.term)), h("span", "val", f2(g)));
    row.append(r1, rail(g)); v.append(row);
  });
}

function viewTerms(d) {
  const v = $("#v-terms"); v.replaceChildren();
  termsOf(d).slice().reverse().forEach((t, i) => {
    const g = num(t.summary && t.summary.FG), det = h("details"), sm = h("summary");
    if (i === 0) det.open = true;
    sm.append(h("span", "t", prettyTerm(t.term)), h("span", "g", f2(g))); det.append(sm);
    if (t.summary && t.summary.Description) det.append(h("p", "sum", t.summary.Description));
    det.append(scale());
    t.courses.forEach((c) => {
      const fg = num(c.FG), row = h("div", "row"), r1 = h("div", "r1");
      r1.append(h("span", "name", titleCase(c.Description || c.col2 || "")), h("span", "val", shown(c.FG)));
      row.append(r1, rail(fg, g), h("div", "meta", `${c["Course Code"] || c.col1 || ""}  \u00b7  ${c.Units || c.col3 || ""} units  \u00b7  midterm ${shown(c.MG)}`));
      det.append(row);
    });
    v.append(det);
  });
  if (!v.children.length) v.append(h("p", "note", "No semesters yet. Import your grades on the Data tab."));
}

function viewData() {
  const v = $("#v-data"); v.replaceChildren();
  v.append(h("h2", null, "Your data"));
  v.append(h("p", "note", "Grades stay on this device. On your computer run python grades.py, send grades.json to this phone (cloud drive, email to yourself, or a cable), then import it here."));
  const act = h("div", "actions"), lab = h("label", "btn", "Import grades.json"), inp = h("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", () => inp.files[0] && importFile(inp.files[0]));
  lab.append(inp); act.append(lab);
  const clr = h("button", "btn ghost", "Forget grades on this device");
  clr.addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch (e) {} store = null; paint(); });
  act.append(clr); v.append(act, h("p", "note", store && store.at ? "Last import: " + new Date(store.at).toLocaleString() : store ? "Loaded from grades.js." : "Nothing imported yet."));
  v.append(h("p", "err", "")); v.lastChild.id = "msg";
  v.append(h("h2", null, "Install on your phone"), h("p", "note", "Open this page in Chrome or Safari, then use the browser menu: Add to Home screen (or Install app). It then opens full screen and works offline."));
}

function importFile(file) {
  file.text().then((txt) => {
    const d = JSON.parse(txt);
    if (!Array.isArray(d) && !Array.isArray(d.terms)) throw new Error("shape");
    store = { data: d, at: Date.now() };
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
    paint(); show("now");
  }).catch(() => { $("#msg").textContent = "That doesn\u2019t look like the grades.json made by grades.py."; });
}

function show(name) {
  ["now", "terms", "data"].forEach((n) => { $("#v-" + n).hidden = n !== name; });
  document.querySelectorAll(".tabs button").forEach((b) => b.toggleAttribute("aria-current", b.dataset.tab === name) || b.removeAttribute("aria-current"));
  document.querySelectorAll(".tabs button").forEach((b) => b.dataset.tab === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  scrollTo(0, 0);
}
function paint() {
  store = store || load();
  $("#stamp").textContent = store && store.at ? new Date(store.at).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  if (store) { viewNow(store.data); viewTerms(store.data); } else { $("#v-now").replaceChildren(h("p", "note", "No grades yet. Open the Data tab to import them.")); $("#v-terms").replaceChildren(); }
  viewData();
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => show(b.dataset.tab)));
paint(); show(store ? "now" : "data");
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
